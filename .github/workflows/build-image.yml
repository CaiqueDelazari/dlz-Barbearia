name: Build production image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
      JWT_SECRET: test-only-jwt-secret-with-more-than-32-characters
      CRON_SECRET: test-only-cron-secret-with-more-than-32-characters
      APP_URL: https://dlzbarbearia.com.br
      NEXT_PUBLIC_APP_URL: https://dlzbarbearia.com.br
      WHATSAPP_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/caiquedelazari/dlz-barbearia:latest
          build-args: |
            NEXT_PUBLIC_APP_URL=https://dlzbarbearia.com.br
